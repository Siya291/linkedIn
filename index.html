<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
</head>

<body>

    <div class="container">
        <div class="row-container">
            <img src="images/linkedin-icon.png" alt="">
            <div class="input-container">
                <img class="icon" src="images/icon-search.png" alt="">
                <input class="input-field" type="text" id="search" name="search" placeholder="Search">
            </div>
            <nav class="nav-icons">
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-home.png" alt="">
                    <span>Home</span>
                </button>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-users.png" alt="">
                    <span>My Network</span>
                </button>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-jobs.png" alt="">
                    <span>Jobs</span>
                </button>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-chat.png" alt="">
                    <span>Messaging</span>
                </button>
                <button class="nav-icon-button" type="button" >
                    <img src="images/icon-notification.png" alt="">
                    <span>Notifications</span>
                </button>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-circle.png" alt="">
                    <span class="nav-label">Me<span class="dropdown-arrow">
                </button>
                <span class="nav-divider"></span>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-grid.png" alt="">
                    <span class="nav-label">For Business<span class="dropdown-arrow" >
                </button>
                <button class="nav-icon-button" type="button">
                    <img src="images/icon-square.png" alt="">
                    <span class="nav-label">Retry Premium<span class="dropdown-arrow">
                </button>
            </nav>
        </div>

    </div>

</body>

</html>
